<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1330" width="1000" height="1330" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9762b"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/>
    </marker>
    <pattern id="screen" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0,6 L6,0" stroke="#555" stroke-width="1"/>
    </pattern>
    <pattern id="bayHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ecebe6"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#dcdad3" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="1330" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d1d1b">Everfresh chamber: functional zones</text>
  <text x="500" y="74" text-anchor="middle" font-size="17" fill="#6b6b66">Side section of one possible stack. Any layout works if these zones and paths hold.</text>

  <!-- ===== Chamber outline ===== -->
  <!-- dry bay -->
  <rect x="330" y="110" width="340" height="100" fill="url(#bayHatch)" stroke="#7d7b74" stroke-width="2"/>
  <text x="500" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#3a3a36">DRY BAY</text>
  <text x="500" y="170" text-anchor="middle" font-size="14" fill="#4a4a45">controller · relay · MOSFETs</text>
  <text x="500" y="189" text-anchor="middle" font-size="14" fill="#4a4a45">supplies · light driver · mains in</text>
  <!-- bay vents to room (left side) -->
  <line x1="330" y1="135" x2="330" y2="185" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M300,160 L326,160" stroke="#7d7b74" stroke-width="2" marker-end="url(#aBlue)" fill="none"/>

  <!-- humid zone body -->
  <rect x="330" y="210" width="340" height="930" fill="#f7fbfb" stroke="#4d4d48" stroke-width="2.5"/>

  <!-- cable glands on bay floor -->
  <g fill="#ffffff" stroke="#3a3a36" stroke-width="2">
    <circle cx="420" cy="210" r="6"/>
    <circle cx="450" cy="210" r="6"/>
    <circle cx="480" cy="210" r="6"/>
  </g>
  <path d="M450,216 q-8,18 4,30" stroke="#3a3a36" stroke-width="1.5" fill="none"/>

  <!-- LED -->
  <rect x="365" y="224" width="270" height="12" rx="3" fill="#fff2c4" stroke="#c9a227" stroke-width="1.5"/>
  <g stroke="#e8cf6a" stroke-width="1.2" opacity="0.8">
    <line x1="400" y1="238" x2="385" y2="290"/>
    <line x1="450" y1="238" x2="445" y2="290"/>
    <line x1="500" y1="238" x2="500" y2="290"/>
    <line x1="550" y1="238" x2="555" y2="290"/>
    <line x1="600" y1="238" x2="615" y2="290"/>
  </g>

  <!-- tree envelope -->
  <rect x="385" y="290" width="230" height="455" rx="60" fill="none" stroke="#5a8f3c" stroke-width="2" stroke-dasharray="9 7"/>
  <!-- tree glyph -->
  <g stroke="#3f6d2a" fill="none" stroke-linecap="round">
    <path d="M498,745 C496,640 488,520 500,420 C506,380 520,350 540,330" stroke-width="5"/>
    <path d="M497,560 C470,540 440,535 412,545" stroke-width="3"/>
    <path d="M500,500 C530,480 565,478 595,492" stroke-width="3"/>
    <path d="M498,440 C470,420 440,410 410,415" stroke-width="3"/>
    <path d="M512,375 C540,360 570,360 598,372" stroke-width="3"/>
  </g>
  <g fill="#6aa84f" opacity="0.85">
    <ellipse cx="455" cy="543" rx="44" ry="9" transform="rotate(8 455 543)"/>
    <ellipse cx="548" cy="484" rx="46" ry="9" transform="rotate(-6 548 484)"/>
    <ellipse cx="452" cy="419" rx="44" ry="9" transform="rotate(10 452 419)"/>
    <ellipse cx="556" cy="363" rx="44" ry="9" transform="rotate(-4 556 363)"/>
    <ellipse cx="548" cy="324" rx="26" ry="7" transform="rotate(-30 548 324)"/>
  </g>

  <!-- canopy probe on adjustable rail (right side) -->
  <line x1="640" y1="320" x2="640" y2="700" stroke="#9a9890" stroke-width="3"/>
  <line x1="634" y1="320" x2="646" y2="320" stroke="#9a9890" stroke-width="3"/>
  <line x1="634" y1="700" x2="646" y2="700" stroke="#9a9890" stroke-width="3"/>
  <rect x="630" y="448" width="20" height="34" rx="9" fill="#ffffff" stroke="#3a3a36" stroke-width="2"/>
  <path d="M640,438 L640,448" stroke="#3a3a36" stroke-width="2"/>

  <!-- plant floor (perforated) and pot -->
  <line x1="330" y1="800" x2="670" y2="800" stroke="#6d6b64" stroke-width="4" stroke-dasharray="14 6"/>
  <path d="M445,745 L555,745 L540,800 L460,800 Z" fill="#c8754a" stroke="#8e4f2e" stroke-width="2"/>

  <!-- heater + circ fan module (left) -->
  <circle cx="395" cy="712" r="62" fill="none" stroke="#d9762b" stroke-width="1.8" stroke-dasharray="6 6"/>
  <rect x="362" y="684" width="66" height="112" rx="6" fill="#fdf1e7" stroke="#8a5a33" stroke-width="2"/>
  <circle cx="395" cy="716" r="17" fill="#f2a65a" stroke="#b5561c" stroke-width="2"/>
  <rect x="368" y="768" width="54" height="16" rx="3" fill="#3a3a36"/>
  <line x1="378" y1="776" x2="412" y2="776" stroke="#bdbdb6" stroke-width="2"/>
  <!-- air into top of shroud -->
  <path d="M395,640 L395,676" stroke="#d9762b" stroke-width="2.5" marker-end="url(#aOrange)" fill="none"/>
  <!-- warm air pushed down through floor then sweeping right -->
  <path d="M395,800 C395,850 420,872 470,870" stroke="#d9762b" stroke-width="2.5" marker-end="url(#aOrange)" fill="none"/>

  <!-- ===== water zone ===== -->
  <!-- refill tank -->
  <rect x="566" y="930" width="82" height="180" rx="6" fill="#ffffff" stroke="#2a9d8f" stroke-width="2.5"/>
  <rect x="568" y="966" width="78" height="142" rx="4" fill="#cfeeea"/>
  <line x1="568" y1="966" x2="646" y2="966" stroke="#2a9d8f" stroke-width="1.5"/>
  <!-- fill pipe out through the right wall -->
  <path d="M648,946 L688,946" stroke="#2a9d8f" stroke-width="7" stroke-linecap="round"/>
  <rect x="686" y="934" width="16" height="24" rx="3" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
  <!-- level window -->
  <rect x="664" y="966" width="6" height="134" fill="#cfeeea" stroke="#2a9d8f" stroke-width="1"/>
  <!-- feed line, tank to basin -->
  <path d="M566,1094 L544,1094" stroke="#2a9d8f" stroke-width="5"/>
  <!-- constant-level basin -->
  <rect x="452" y="1018" width="92" height="92" rx="6" fill="#ffffff" stroke="#2a9d8f" stroke-width="2.5"/>
  <rect x="454" y="1040" width="88" height="68" rx="4" fill="#cfeeea"/>
  <line x1="454" y1="1040" x2="542" y2="1040" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- fogger disc -->
  <ellipse cx="500" cy="1094" rx="24" ry="7" fill="#2f3b3a"/>
  <!-- float switch -->
  <rect x="458" y="1046" width="12" height="20" rx="3" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.8"/>
  <!-- mist plume, splitting around the pot -->
  <g stroke="#2a9d8f" stroke-width="2" fill="none" stroke-dasharray="3 6" stroke-linecap="round">
    <path d="M486,1034 C470,990 500,950 478,905 C462,872 440,850 440,822"/>
    <path d="M514,1034 C530,990 506,950 530,905 C548,872 566,850 566,822"/>
  </g>
  <path d="M440,826 L440,808" stroke="#2a9d8f" stroke-width="2" marker-end="url(#aTeal)" fill="none"/>
  <path d="M566,826 L566,808" stroke="#2a9d8f" stroke-width="2" marker-end="url(#aTeal)" fill="none"/>

  <!-- catch pan sloped to drain -->
  <path d="M332,1112 L668,1134" stroke="#2a9d8f" stroke-width="3" fill="none"/>
  <path d="M652,1134 L652,1190" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/>
  <rect x="642" y="1160" width="20" height="10" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>

  <!-- intake (left wall, low) -->
  <rect x="322" y="862" width="16" height="66" fill="url(#screen)" stroke="#3a3a36" stroke-width="2"/>
  <!-- ambient probe outside -->
  <rect x="268" y="828" width="18" height="30" rx="8" fill="#ffffff" stroke="#3a3a36" stroke-width="2"/>
  <path d="M277,818 L277,828" stroke="#3a3a36" stroke-width="2"/>

  <!-- exhaust (right wall, high) -->
  <rect x="660" y="252" width="20" height="78" fill="#3a3a36"/>
  <line x1="670" y1="262" x2="670" y2="320" stroke="#bdbdb6" stroke-width="2"/>
  <!-- backdraft flap -->
  <path d="M686,252 L700,318" stroke="#3a3a36" stroke-width="3"/>
  <circle cx="686" cy="252" r="3" fill="#3a3a36"/>
  <path d="M706,291 L760,291" stroke="#2f6fb3" stroke-width="3" marker-end="url(#aBlue)" fill="none"/>

  <!-- main air path: intake low-left to exhaust high-right -->
  <path d="M230,895 L318,895" stroke="#2f6fb3" stroke-width="3" marker-end="url(#aBlue)" fill="none"/>
  <path d="M345,895 C450,905 590,890 606,812 C618,720 575,560 590,450 C598,380 615,330 652,296" stroke="#2f6fb3" stroke-width="2.6" stroke-dasharray="11 7" marker-end="url(#aBlue)" fill="none"/>

  <!-- ===== Left labels ===== -->
  <g font-size="15.5" fill="#2b2b28">
    <!-- bay vent -->
    <text x="20" y="140"><tspan font-weight="700">Dry bay</tspan><tspan x="20" dy="20">Electronics on a lift-out tray,</tspan><tspan x="20" dy="20">one fused power inlet. Sealed</tspan><tspan x="20" dy="20">from the humid zone, vented to</tspan><tspan x="20" dy="20">the room. Never below water.</tspan></text>

    <text x="20" y="266"><tspan font-weight="700">Bulkhead + cable chases</tspan><tspan x="20" dy="20">Keyed plugs, one per module.</tspan><tspan x="20" dy="20">Cables hidden in the frame,</tspan><tspan x="20" dy="20">mains apart from signal.</tspan></text>
    <path d="M226,262 L414,206" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="20" y="372"><tspan font-weight="700">Grow light</tspan><tspan x="20" dy="20">About 300 PPFD over the</tspan><tspan x="20" dy="20">planted area, dimmable. Not</tspan><tspan x="20" dy="20">chosen yet: leave room for a</tspan><tspan x="20" dy="20">top panel or upright bars.</tspan><tspan x="20" dy="20">Driver in the dry bay.</tspan></text>
    <path d="M232,378 L366,236" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="20" y="602"><tspan font-weight="700" fill="#b5561c">Heater in the circ airflow</tspan><tspan x="20" dy="20">Ceramic, shrouded, above the</tspan><tspan x="20" dy="20">circ fan, which blows down.</tspan><tspan x="20" dy="20">Sized for single glass (about</tspan><tspan x="20" dy="20">150 W for this box). Keep-out</tspan><tspan x="20" dy="20">(dashed): leaves, glass, mist.</tspan></text>
    <path d="M262,668 L360,712" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="20" y="800"><tspan font-weight="700" fill="#2f6fb3">Passive intake, low</tspan><tspan x="20" dy="20">Screened, at least as open as</tspan><tspan x="20" dy="20">the exhaust fan. Ambient probe</tspan><tspan x="20" dy="20">just outside it.</tspan></text>

    
  </g>

  <!-- ===== Right labels ===== -->
  <g font-size="15.5" fill="#2b2b28">
    <text x="712" y="226"><tspan font-weight="700" fill="#2f6fb3">Exhaust fan, high</tspan><tspan x="712" dy="20">Port cut to the fan body.</tspan></text>
    <text x="770" y="296" font-size="15.5">straight to the room</text>
    <text x="712" y="334"><tspan>Backdraft flap stops the</tspan><tspan x="712" dy="20">chimney when it's off.</tspan></text>

    <text x="712" y="436"><tspan font-weight="700">Canopy probe</tspan><tspan x="712" dy="20">Leaf height, clear of every</tspan><tspan x="712" dy="20">leaf, on an adjustable mount.</tspan><tspan x="712" dy="20">Out of heater view, mist,</tspan><tspan x="712" dy="20">and direct sun.</tspan></text>
    <path d="M708,452 L652,462" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="712" y="590"><tspan font-weight="700" fill="#3f6d2a">Plant envelope</tspan><tspan x="712" dy="20">16 in today, 28 in within a</tspan><tspan x="712" dy="20">year. 2 gal pot, room for 4.</tspan></text>
    <path d="M708,596 L616,610" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="712" y="712"><tspan font-weight="700">Plant floor</tspan><tspan x="712" dy="20">Open to air and mist. The pot</tspan><tspan x="712" dy="20">could sit on the pan instead.</tspan></text>
    <path d="M708,744 L668,798" stroke="#9a9890" stroke-width="1.2" fill="none"/>

    <text x="712" y="866"><tspan font-weight="700" fill="#2a9d8f">Water supply</tspan><tspan x="712" dy="20">Constant-depth basin for the</tspan><tspan x="712" dy="20">fogger, fed by a bigger tank.</tspan><tspan x="712" dy="20">Refill from outside, level</tspan><tspan x="712" dy="20">visible, float switch. Both</tspan><tspan x="712" dy="20">lift out to clean.</tspan></text>

    <text x="712" y="1100"><tspan font-weight="700" fill="#2a9d8f">Floor pan</tspan><tspan x="712" dy="20">Sealed, sloped to a drain or</tspan><tspan x="712" dy="20">pull-out tray. Takes spills</tspan><tspan x="712" dy="20">and condensation. No standing</tspan><tspan x="712" dy="20">water by design.</tspan></text>
    <path d="M708,1146 L660,1166" stroke="#9a9890" stroke-width="1.2" fill="none"/>
  </g>

  <!-- door note + legend -->
  <text x="500" y="1226" text-anchor="middle" font-size="15.5" fill="#4a4a45">Front door (not in this section): full height, gasketed, a latch that pulls it tight.</text>

  <g font-size="15" fill="#2b2b28">
    <line x1="150" y1="1272" x2="190" y2="1272" stroke="#2f6fb3" stroke-width="3" stroke-dasharray="11 7"/>
    <text x="198" y="1277">room air through</text>
    <line x1="350" y1="1272" x2="390" y2="1272" stroke="#d9762b" stroke-width="3"/>
    <text x="398" y="1277">heat + circ air</text>
    <line x1="535" y1="1272" x2="575" y2="1272" stroke="#2a9d8f" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
    <text x="583" y="1277">mist / water</text>
    <circle cx="715" cy="1272" r="14" fill="none" stroke="#d9762b" stroke-width="1.8" stroke-dasharray="6 6"/>
    <text x="737" y="1277">keep-out</text>
  </g>
</svg>
